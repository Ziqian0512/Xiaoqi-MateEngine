<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>小祈 · 菜单功能核对</title><style>body{font:14px/1.8 'Microsoft YaHei UI',sans-serif;background:#f7f4fa;color:#574a68;margin:40px}h1{font-size:26px;font-weight:500}p{max-width:1000px;color:#96849f}table{border-collapse:collapse;background:#fff;width:100%;font-size:12px}th,td{padding:14px;text-align:left;vertical-align:top;border-bottom:1px solid #e9e1ef}th{background:#eae1f3}td:nth-child(1){width:80px}td:nth-child(2){width:130px}td:nth-child(3){width:120px;color:#a16b8c}td:last-child{max-width:260px;word-break:break-word;color:#aa98b6;font-size:10px}input{padding:12px;width:360px;border:1px solid #d7c9e2;border-radius:10px;margin:20px 0}a{color:#8c739f}</style><h1>菜单与设置 · 功能核对及处理方案</h1><p>2026-11-20，基于当前 xiaoqi/p2-agy4 源码的只读核对。“已接线”表示存在调用路径，不等于真人麦克风、动画或系统窗口已验收。所有运行版修复均待实施；本轮只完成预览与审计。</p><a href="index.html">← 回交互预览</a><input id="filter" placeholder="筛选：缺陷 / 声音 / 位置 / 已接线"><table><thead><tr><th>分类</th><th>入口</th><th>结论</th><th>现状与边界</th><th>处理方案</th><th>源码依据（Assets/Xiaoqi/ 起）</th></tr></thead><tbody></tbody></table><script src="audit-data.js"></script><script>const body=document.querySelector('tbody');function draw(){const q=document.querySelector('input').value;body.innerHTML=window.auditRows.filter(r=>r.join(' ').includes(q)).map(r=>'<tr>'+r.map(t=>'<td>'+t+'</td>').join('')+'</tr>').join('')}document.querySelector('input').oninput=draw;draw();</script></html>
